# Local lab stack.
#
# App:        http://localhost:9090  productservice
#             http://localhost:9091  couponservice
# Prometheus: http://localhost:9095
# Grafana:    http://localhost:3000  (anonymous admin)
# Tempo API:  http://localhost:3200
# OTLP HTTP:  http://localhost:4318
#
# Build the app images first: ../bin/docker-build.sh
# Then: docker compose up
services:
  mysql:
    image: mysql:8.0
    container_name: couponservice-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: servicedb
    volumes:
      - mysql-data:/var/lib/mysql
      - ../couponservice/sql/tables.sql:/docker-entrypoint-initdb.d/01-tables.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  couponservice:
    image: couponservice:${IMAGE_TAG:-local}
    pull_policy: never
    container_name: couponservice
    ports:
      - "9091:9091"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/servicedb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      MANAGEMENT_TRACING_ENABLED: "true"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      mysql:
        condition: service_healthy
      otel-collector:
        condition: service_started

  productservice:
    image: productservice:${IMAGE_TAG:-local}
    pull_policy: never
    container_name: productservice
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/servicedb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      # couponService.url. COUPON_SERVICE_URL would bind to coupon.service.url instead.
      COUPONSERVICE_URL: http://couponservice:9091/couponapi/coupons/
      MANAGEMENT_TRACING_ENABLED: "true"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      mysql:
        condition: service_healthy
      couponservice:
        condition: service_started
      otel-collector:
        condition: service_started

  tempo-init:
    image: busybox:1.36
    user: root
    command: ["chown", "10001:10001", "/var/tempo"]
    volumes:
      - tempo-data:/var/tempo

  tempo:
    image: grafana/tempo:2.10.8
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    depends_on:
      tempo-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector:0.162.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      tempo:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    ports:
      - "9095:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:13.2.4
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo

volumes:
  mysql-data:
  tempo-data:
