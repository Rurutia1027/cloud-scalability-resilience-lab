spring:
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:mysql://localhost:3306/servicedb
    username: root
    password: ""
server:
  port: 9090

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: productservice
    # Histograms stay aggregatable across replicas. Client-side percentiles do not.
    distribution:
      percentiles-histogram:
        http.server.requests: true
        coupon.client.request.duration: true
        product.db.operation.duration: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s

couponService:
  url: http://localhost:9091/couponapi/coupons/

