# Same local stack as cloud-scalability-resilience-lab, on one EC2.
#
# Grafana:       http://<public-ip>:3000
# productservice http://<public-ip>:9090   (nginx in front of the replicas)
#
# productservice and couponservice have no container_name, so
# `docker compose up --scale` can add replicas. nginx owns host port 9090.
name: docker-assignment

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: servicedb
    volumes:
      - mysql-data:/var/lib/mysql
      - ../couponservice/sql/tables.sql:/docker-entrypoint-initdb.d/01-tables.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  couponservice:
    build: ../couponservice
    image: couponservice:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/servicedb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      JAVA_TOOL_OPTIONS: "-Dnetworkaddress.cache.ttl=5"
      MANAGEMENT_TRACING_ENABLED: "true"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      mysql:
        condition: service_healthy
      otel-collector:
        condition: service_started
    deploy:
      replicas: 1
    mem_reservation: 512m
    mem_limit: 768m
    restart: unless-stopped

  productservice:
    build: ../productservice
    image: productservice:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/servicedb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      JAVA_TOOL_OPTIONS: "-Dnetworkaddress.cache.ttl=5"
      COUPONSERVICE_URL: http://couponservice:9091/couponapi/coupons/
      MANAGEMENT_TRACING_ENABLED: "true"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      mysql:
        condition: service_healthy
      couponservice:
        condition: service_started
      otel-collector:
        condition: service_started
    deploy:
      replicas: 1
    mem_reservation: 512m
    mem_limit: 768m
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "9090:9090"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - productservice
    restart: unless-stopped

  tempo-init:
    image: busybox:1.36
    user: root
    command: ["chown", "10001:10001", "/var/tempo"]
    volumes:
      - tempo-data:/var/tempo

  tempo:
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    depends_on:
      tempo-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      tempo:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

volumes:
  mysql-data:
  tempo-data:
