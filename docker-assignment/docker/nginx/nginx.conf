events {}

http {
  # Compose DNS. A variable in proxy_pass makes nginx resolve it again,
  # so a replica added by docker compose scale receives traffic.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 9090;

    location / {
      set $product productservice;
      proxy_pass http://$product:9090;
      proxy_set_header Host $host;
    }
  }
}
