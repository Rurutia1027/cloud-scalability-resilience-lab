apiVersion: v1
kind: ConfigMap
metadata:
  name: csr-lab-dashboards
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: CSR lab
data:
  application.json: |
{{ .Files.Get "dashboards/application.json" | indent 4 }}
  traces.json: |
{{ .Files.Get "dashboards/traces.json" | indent 4 }}
