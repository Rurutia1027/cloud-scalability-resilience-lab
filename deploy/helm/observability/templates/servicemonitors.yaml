# Scrapes the actuator endpoints inside the cluster. The release label is what
# kube-prometheus-stack selects. Coupon metrics stay on ClusterIP. Product
# metrics are scraped on the cluster port, not through the public ingress.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: productservice
  namespace: {{ .Values.appNamespace }}
  labels:
    release: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app: productservice
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: couponservice
  namespace: {{ .Values.appNamespace }}
  labels:
    release: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app: couponservice
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
