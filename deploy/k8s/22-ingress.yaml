# Public entry for productservice. The AWS Load Balancer Controller turns this
# Ingress into an internet-facing ALB. kubectl get ingress prints that ALB's
# DNS name; clients use the name, not a node IP. couponservice stays ClusterIP
# and is not on this Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: productservice
  namespace: csr-lab
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: csr-lab
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: productservice
                port:
                  number: 9090
