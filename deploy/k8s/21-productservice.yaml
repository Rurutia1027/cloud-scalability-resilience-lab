apiVersion: apps/v1
kind: Deployment
metadata:
  name: productservice
  namespace: csr-lab
  labels:
    app: productservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productservice
  template:
    metadata:
      labels:
        app: productservice
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: productservice
      containers:
        - name: productservice
          image: 943208837077.dkr.ecr.eu-west-1.amazonaws.com/csr-lab-productservice:49cc5d3
          ports:
            - name: http
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: app
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: productservice
  namespace: csr-lab
spec:
  # NodePort rather than LoadBalancer: k6 reaches a node's public IP directly and
  # the lab avoids a load balancer's hourly charge. tf-eks opens 30090 on the
  # cluster security group.
  type: NodePort
  selector:
    app: productservice
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: 30090
