apiVersion: apps/v1
kind: Deployment
metadata:
  name: couponservice
  namespace: csr-lab
  labels:
    app: couponservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: couponservice
  template:
    metadata:
      labels:
        app: couponservice
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: couponservice
      containers:
        - name: couponservice
          # The concrete commit tag the pipeline pushed, never latest, so one load
          # test maps to one image version.
          image: 943208837077.dkr.ecr.eu-west-1.amazonaws.com/csr-lab-couponservice:dec536a
          ports:
            - name: http
              containerPort: 9091
          envFrom:
            - configMapRef:
                name: app
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Spring Boot on a t3.small needs well over a minute of headroom before
          # liveness is allowed to start restarting the container.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: couponservice
  namespace: csr-lab
spec:
  # Not published. Only productservice is reachable from outside the cluster.
  type: ClusterIP
  selector:
    app: couponservice
  ports:
    - name: http
      port: 9091
      targetPort: http
