apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: couponservice
  namespace: csr-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: couponservice
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          # 100% of the 512Mi request. The local process sits near 480Mi after load,
          # so a further rise in working set is what adds pods.
          averageUtilization: 100
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 120
