apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: couponservice
  namespace: csr-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: couponservice
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          # 30% of the 512Mi request is about 154Mi. A warm JVM sits above that.
          averageUtilization: 30
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 120
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: productservice
  namespace: csr-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: productservice
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          # 10% of the 512Mi request is about 51Mi. A warm JVM sits above that.
          averageUtilization: 10 # average utilization is around 20% 
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 120
