apiVersion: v1
kind: ConfigMap
metadata:
  name: app
  namespace: csr-lab
data:
  # terraform -chdir=tf-eks output -raw spring_datasource_url
  SPRING_DATASOURCE_URL: jdbc:mysql://csr-lab-mysql.c70eww46ijse.eu-west-1.rds.amazonaws.com:3306/servicedb
  SPRING_DATASOURCE_USERNAME: labadmin

  # Pointer only, the same role as {VAULT:key} in idm-service. Not the password.
  # terraform -chdir=tf-eks output -raw db_master_user_secret_arn
  DB_SECRET_ID: REPLACE_WITH_SECRET_ARN
  AWS_REGION: eu-west-1

  # Spring resolves the @Value("${couponService.url}") placeholder from COUPONSERVICE_URL.
  # COUPON_SERVICE_URL does not bind to it, because the underscores would make it coupon.service.url.
  COUPONSERVICE_URL: http://couponservice:9091/couponapi/coupons/

  # Off in application.yml. These turn tracing on and send spans to the
  # collector installed by deploy/helm/observability. Export retries if that
  # collector is not up yet; the process still starts.
  MANAGEMENT_TRACING_ENABLED: "true"
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector.observability.svc:4318/v1/traces
