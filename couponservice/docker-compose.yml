services:
  mysql:
    image: mysql:8.0
    container_name: couponservice-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: servicedb
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/tables.sql:/docker-entrypoint-initdb.d/01-tables.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
